name: Build Padavan HC5661A HWNAT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      - name: Download Toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Prepare Config & Enable HWNAT & Build
        run: |
          cd trunk
          
          # 1. 拷贝模版配置文件
          if [ -f configs/templates/HC5661A.config ]; then
            cp -f configs/templates/HC5661A.config .config
          elif [ -f configs/boards/HC5661A/config ]; then
            cp -f configs/boards/HC5661A/config .config
          fi

          # 2. 强制开启 HWNAT 硬件加速编译选项
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HWNAT=n/CONFIG_FIRMWARE_INCLUDE_HWNAT=y/g' .config
          sed -i 's/# CONFIG_FIRMWARE_INCLUDE_HWNAT is not set/CONFIG_FIRMWARE_INCLUDE_HWNAT=y/g' .config
          if ! grep -q "CONFIG_FIRMWARE_INCLUDE_HWNAT=" .config; then
            echo "CONFIG_FIRMWARE_INCLUDE_HWNAT=y" >> .config
          fi

          # 3. 开始编译
          ./clear_tree
          fakeroot ./build_firmware_modify HC5661A

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan_HC5661A_HWNAT
          path: trunk/images/*.trx
